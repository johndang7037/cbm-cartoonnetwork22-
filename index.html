<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mô Phỏng Trang Game - Video Cảnh Báo Cờ Bạc Mạng</title>
  <style>
    :root {
      --bg: #0b0c10;
      --card-bg: #1f2833;
      --gold: #f1c40f;
      --red: #e74c3c;
      --green: #2ecc71;
      --text: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Băng rôn cảnh báo */
    .warning-banner {
      width: 100%;
      max-width: 950px;
      background: #c0392b;
      color: white;
      text-align: center;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      margin-bottom: 15px;
      font-size: 0.95rem;
    }

    /* Thanh thông tin tài khoản */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 950px;
      background: #151922;
      padding: 15px 20px;
      border-radius: 10px;
      border: 1px solid #333;
      margin-bottom: 20px;
    }
    .user-info { font-size: 1.1rem; }
    .balance {
      color: var(--gold);
      font-weight: bold;
      font-size: 1.3rem;
    }
    .btn-reset {
      background: #34495e;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 5px;
      cursor: pointer;
    }

    /* Khung trò chơi */
    .games-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      width: 100%;
      max-width: 950px;
    }
    @media (max-width: 768px) {
      .games-grid { grid-template-columns: 1fr; }
    }

    .game-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      border: 1px solid #333;
    }
    .game-card h2 {
      margin-top: 0;
      color: var(--gold);
      font-size: 1.4rem;
    }

    /* Khu vực Xúc xắc */
    .dice-area {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin: 20px 0;
    }
    .dice-box {
      width: 65px;
      height: 65px;
      background: #ffffff;
      color: #000;
      border-radius: 12px;
      font-size: 2rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    /* Khu vực Nổ hũ */
    .slot-area {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 20px 0;
    }
    .reel {
      width: 75px;
      height: 75px;
      background: #0f141c;
      border: 2px solid var(--gold);
      border-radius: 10px;
      font-size: 2.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .action-btn {
      background: linear-gradient(135deg, #f39c12, #d35400);
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      margin: 5px;
    }
    .action-btn:hover { opacity: 0.9; }
    .action-btn:disabled { background: #555; cursor: not-allowed; }

    .msg-box {
      margin-top: 15px;
      min-height: 25px;
      font-weight: 500;
    }
